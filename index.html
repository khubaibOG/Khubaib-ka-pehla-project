                    <p className="font-mono text-[10px] text-pink uppercase tracking-widest">Discreet Private Elevator Entry</p>
                  </div>
                </div>

                <div className="relative z-10 flex flex-col sm:flex-row items-center justify-between gap-4 pt-6 border-t border-[#3B1D5C]">
                  <div className="text-graphite font-mono text-xs">
                    <span>2 min walk from 68 St - Hunter College Station</span>
                  </div>
                  <a 
                    href="https://maps.google.com" 
                    target="_blank" 
                    rel="noopener noreferrer" 
                    className="px-5 py-2.5 rounded-full bg-pink text-white hover:bg-pink-dark transition-all font-mono text-xs uppercase tracking-wider font-semibold shadow-md shadow-pink/20"
                  >
                    Open in Maps &rarr;
                  </a>
                </div>
              </div>
            </div>
          </section>

          {/* FOOTER */}
          <footer className="bg-[#0B0414] border-t border-[#3B1D5C] pt-20 pb-12 relative overflow-hidden">
            <div className="absolute -bottom-10 left-1/2 transform -translate-x-1/2 pointer-events-none select-none opacity-[0.05] whitespace-nowrap font-serif text-[18vw] leading-none text-pink uppercase tracking-tighter">
              CARMINE
            </div>

            <div className="max-w-7xl mx-auto px-6 md:px-12 relative z-10">
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-12 mb-16">
                <div className="lg:col-span-2 space-y-4">
                  <div className="group flex items-center space-x-3.5 select-none cursor-pointer">
                    <div className="relative w-9 h-9 flex items-center justify-center">
                      <svg className="absolute inset-0 w-full h-full logo-ring-rotate" viewBox="0 0 44 44">
                        <circle cx="22" cy="22" r="20" fill="none" stroke="#EC4899" strokeWidth="1" strokeDasharray="3 5" className="opacity-50 group-hover:opacity-100 transition-opacity" />
                      </svg>
                      <div className="logo-monogram-box w-7 h-7 border border-pink/50 flex items-center justify-center font-serif text-sm font-bold bg-[#160B24] text-white">
                        <span className="logo-monogram-inner">AC</span>
                      </div>
                    </div>
                    <div className="flex flex-col">
                      <span className="font-serif text-xl tracking-widest uppercase font-medium logo-shimmer-text">Atelier Carmine</span>
                      <span className="font-mono text-[8px] tracking-ultra-wide uppercase text-graphite group-hover:text-pink transition-colors">Haute Coiffure LLC</span>
                    </div>
                  </div>
                  <p className="text-graphite text-xs sm:text-sm max-w-sm leading-relaxed">
                    New York's premier sanctuary for tailored cranial architecture, Japanese straight razor rituals, and private bespoke restorative care.
                  </p>
                  <div className="font-mono text-xs text-pink pt-2 flex items-center space-x-2">
                    <span className="w-2 h-2 rounded-full bg-pink"></span>
                    <span className="text-graphite">{currentTimeStr || 'New York Time (EST)'}</span>
                  </div>
                </div>

                <div>
                  <h4 className="font-mono text-xs uppercase tracking-widest text-white font-bold mb-4">Navigation</h4>
                  <ul className="space-y-2.5 font-mono text-xs text-graphite">
                    <li><a href="#services" className="hover:text-pink">Curated Services</a></li>
                    <li><a href="#packages" className="hover:text-pink">Signature Suites</a></li>
                    <li><a href="#experience" className="hover:text-pink">The Japanese Steel Craft</a></li>
                    <li><a href="#barbers" className="hover:text-pink">Master Artisans</a></li>
                    <li><a href="#hours-location" className="hover:text-pink">Sanctuary & Valet</a></li>
                  </ul>
                </div>

                <div>
                  <h4 className="font-mono text-xs uppercase tracking-widest text-white font-bold mb-4">Ritual Suites</h4>
                  <ul className="space-y-2.5 font-mono text-xs text-graphite">
                    <li><a href="#packages" className="hover:text-pink">The Executive Ritual ($185)</a></li>
                    <li><a href="#packages" className="hover:text-pink">The Groom's Delegation ($260)</a></li>
                    <li><a href="#packages" className="hover:text-pink">Quick Refresher ($95)</a></li>
                    <li><a href="#services" className="hover:text-pink">Japanese Head Spa</a></li>
                    <li><a href="#services" className="hover:text-pink">Grey Blending Camouflage</a></li>
                  </ul>
                </div>

                <div>
                  <h4 className="font-mono text-xs uppercase tracking-widest text-white font-bold mb-4">Concierge</h4>
                  <ul className="space-y-2.5 font-mono text-xs text-graphite">
                    <li><a href="tel:+12128449100" className="hover:text-pink">VIP Line: (212) 844-9100</a></li>
                    <li><a href="mailto:concierge@ateliercarmine.com" className="hover:text-pink">Private Lounge Buyouts</a></li>
                    <li><a href="mailto:events@ateliercarmine.com" className="hover:text-pink">Wedding Delegation Prep</a></li>
                    <li><a href="#" className="hover:text-pink">Gift Ceremonies & Black Card</a></li>
                  </ul>
                </div>
              </div>

              <div className="border-t border-[#3B1D5C] pt-8 flex flex-col sm:flex-row items-center justify-between text-[11px] font-mono text-graphite/70 gap-4">
                <div>
                  &copy; {new Date().getFullYear()} Atelier Carmine Haute Coiffure LLC. All Rights Reserved.
                </div>
                <div className="flex items-center space-x-6">
                  <a href="#" className="hover:text-pink">Privacy Protocol</a>
                  <a href="#" className="hover:text-pink">Terms of Sanctuary</a>
                  <a href="#" className="hover:text-pink">Accessibility Standards</a>
                </div>
              </div>
            </div>
          </footer>

          {/* BOOKING DRAWER MODAL */}
          {bookingDrawerOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden">
              <div onClick={closeBooking} className="fixed inset-0 bg-[#07020E]/80 backdrop-blur-md transition-opacity"></div>
              
              <aside className="fixed top-0 right-0 bottom-0 w-full sm:max-w-xl bg-[#160B24] border-l border-[#3B1D5C] shadow-2xl flex flex-col justify-between overflow-hidden z-10 text-white">
                <div className="p-6 border-b border-[#3B1D5C] flex items-center justify-between bg-[#120722]">
                  <div>
                    <span className="font-mono text-[10px] text-pink font-semibold uppercase tracking-widest">// Private Reservation</span>
                    <h3 className="font-serif text-2xl font-normal text-white">Reserve Your Chair</h3>
                  </div>
                  <button onClick={closeBooking} className="p-2 text-graphite hover:text-pink font-mono text-lg">✕</button>
                </div>

                {/* Progress */}
                {bookingStep <= 4 && (
                  <div className="px-6 py-3 bg-[#120722] border-b border-[#3B1D5C] flex items-center justify-between font-mono text-[11px]">
                    {[
                      { s: 1, l: 'Service' },
                      { s: 2, l: 'Date & Time' },
                      { s: 3, l: 'Artisan' },
                      { s: 4, l: 'Confirm' }
                    ].map(stepItem => (
                      <div key={stepItem.s} className={`flex items-center space-x-1.5 ${
                        bookingStep === stepItem.s ? 'text-pink font-semibold' : bookingStep > stepItem.s ? 'text-white font-medium' : 'text-graphite/40'
                      }`}>
                        <span className={`w-5 h-5 rounded-full border flex items-center justify-center text-[10px] ${
                          bookingStep === stepItem.s ? 'border-pink bg-pink/20' : 'border-[#3B1D5C]'
                        }`}>
                          {bookingStep > stepItem.s ? '✓' : stepItem.s}
                        </span>
                        <span>{stepItem.l}</span>
                      </div>
                    ))}
                  </div>
                )}

                {/* Content */}
                <div className="flex-1 overflow-y-auto p-6 space-y-6">
                  
                  {/* Step 1: Addons & Summary */}
                  {bookingStep === 1 && (
                    <div className="space-y-6">
                      <div>
                        <label className="font-mono text-xs uppercase text-graphite block mb-2 font-medium">Selected Service or Suite</label>
                        <div className="border border-pink/40 rounded-xl p-4 bg-[#200F35] flex justify-between items-center">
                          <div>
                            <p className="font-serif text-xl font-normal text-white">{selectedService.name}</p>
                            <div className="flex items-center space-x-3 text-xs font-mono text-graphite mt-1">
                              <span>{selectedService.duration}</span>
                              <span>&bull;</span>
                              <span>{selectedService.category}</span>
                            </div>
                          </div>
                          <span className="font-mono text-xl font-bold text-pink">${selectedService.price}</span>
                        </div>
                      </div>

                      <div>
                        <label className="font-mono text-xs uppercase text-graphite block mb-2 font-medium">Elevate Your Appointment (Add-ons)</label>
                        <div className="space-y-3 font-mono text-xs">
                          {ADDONS.map(addon => {
                            const isChecked = selectedAddons.includes(addon.id);
                            return (
                              <label key={addon.id} className={`flex items-center justify-between p-3.5 border rounded-xl cursor-pointer transition-colors ${
                                isChecked ? 'border-pink bg-pink/15' : 'border-[#3B1D5C] bg-[#160B24] hover:border-pink/50'
                              }`}>
                                <div className="flex items-center space-x-3">
                                  <input 
                                    type="checkbox" 
                                    checked={isChecked} 
                                    onChange={() => toggleAddon(addon.id)} 
                                    className="w-4 h-4 accent-pink rounded"
                                  />
                                  <div>
                                    <span className="block font-sans text-xs font-medium text-white">{addon.name}</span>
                                    <span className="text-[10px] text-graphite">{addon.duration}</span>
                                  </div>
                                </div>
                                <span className="text-pink font-semibold">+${addon.price}</span>
                              </label>
                            );
                          })}
                        </div>
                      </div>

                      <div className="p-4 rounded-xl bg-pink/10 border border-pink/30 text-xs text-graphite">
                        All appointments include complimentary Kyoto cold brew or single malt Scotch in the lounge.
                      </div>
                    </div>
                  )}

                  {/* Step 2: Date & Time */}
                  {bookingStep === 2 && (
                    <div className="space-y-6">
                      <div>
                        <label className="font-mono text-xs uppercase text-graphite block mb-2 font-medium">Select Preferred Date</label>
                        <div className="grid grid-cols-4 gap-2 font-mono text-xs">
                          {['Today (Nov 3)', 'Wed (Nov 4)', 'Thu (Nov 5)', 'Fri (Nov 6)'].map(d => (
                            <button
                              key={d}
                              onClick={() => setSelectedDate(d)}
                              className={`p-3 text-center rounded-xl border transition-all ${
                                selectedDate === d ? 'border-pink bg-pink/20 text-pink font-bold' : 'border-[#3B1D5C] bg-[#160B24] hover:border-pink/50 text-white'
                              }`}
                            >
                              <span className="block text-[10px] uppercase text-graphite/70">{d.split(' ')[0]}</span>
                              <span className="block text-sm font-semibold mt-0.5">{d.split(' ')[1]}</span>
                            </button>
                          ))}
                        </div>
                      </div>

                      <div>
                        <label className="font-mono text-xs uppercase text-graphite block mb-2 font-medium">Available Timeslots (Live Sync)</label>
                        <div className="grid grid-cols-3 gap-2 font-mono text-xs">
                          {['10:00 AM', '11:30 AM', '01:00 PM', '02:30 PM', '04:00 PM', '05:30 PM', '07:00 PM', '08:15 PM'].map(t => (
                            <button
                              key={t}
                              onClick={() => setSelectedTime(t)}
                              className={`py-2.5 px-3 text-center rounded-xl border transition-all ${
                                selectedTime === t ? 'border-pink bg-pink text-white font-bold shadow-lg shadow-pink/30' : 'border-[#3B1D5C] bg-[#160B24] hover:border-pink/50 text-graphite'
                              }`}
                            >
                              {t}
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}

                  {/* Step 3: Artisan */}
                  {bookingStep === 3 && (
                    <div className="space-y-4">
                      <label className="font-mono text-xs uppercase text-graphite block font-medium">Select Master Artisan</label>
                      <div className="space-y-3 font-mono text-xs">
                        {ARTISANS.map((a, i) => (
                          <label key={i} className={`flex items-center justify-between p-3.5 border rounded-xl cursor-pointer transition-all ${
                            selectedBarber === a.name ? 'border-pink bg-pink/20' : 'border-[#3B1D5C] bg-[#160B24] hover:border-pink/50'
                          }`}>
                            <div className="flex items-center space-x-3">
                              <input 
                                type="radio" 
                                name="barber_radio" 
                                checked={selectedBarber === a.name} 
                                onChange={() => setSelectedBarber(a.name)} 
                                className="w-4 h-4 accent-pink"
                              />
                              <div>
                                <span className="block font-sans text-xs font-semibold text-white">{a.name}</span>
                                <span className="text-[10px] text-pink-light">{a.title} &bull; {a.chair}</span>
                              </div>
                            </div>
                            <span className="text-[10px] font-mono text-graphite bg-[#200F35] px-2 py-0.5 rounded border border-[#3B1D5C]">{a.experience}</span>
                          </label>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Step 4: Contact & Summary */}
                  {bookingStep === 4 && (
                    <div className="space-y-6">
                      <div>
                        <h4 className="font-serif text-xl font-normal text-white mb-1">Guest Information</h4>
                        <p className="text-graphite text-xs">A confirmation SMS & calendar invite will be dispatched upon booking.</p>
                      </div>

                      <div className="space-y-4 font-mono text-xs">
                        <div>
                          <label className="block text-graphite uppercase mb-1">Full Name *</label>
                          <input 
                            type="text" 
                            value={clientInfo.name} 
                            onChange={e => setClientInfo({ ...clientInfo, name: e.target.value })} 
                            placeholder="Lord / Mr. Alexander Sterling" 
                            className="w-full px-4 py-3 border border-[#3B1D5C] rounded-xl focus:border-pink focus:outline-none bg-[#200F35] font-sans text-sm text-white"
                          />
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-graphite uppercase mb-1">Mobile Phone (SMS) *</label>
                            <input 
                              type="tel" 
                              value={clientInfo.phone} 
                              onChange={e => setClientInfo({ ...clientInfo, phone: e.target.value })} 
                              placeholder="+1 (212) 555-0199" 
                              className="w-full px-4 py-3 border border-[#3B1D5C] rounded-xl focus:border-pink focus:outline-none bg-[#200F35] font-sans text-sm text-white"
                            />
                          </div>
                          <div>
                            <label className="block text-graphite uppercase mb-1">Email Address *</label>
                            <input 
                              type="email" 
                              value={clientInfo.email} 
                              onChange={e => setClientInfo({ ...clientInfo, email: e.target.value })} 
                              placeholder="alexander@domain.com" 
                              className="w-full px-4 py-3 border border-[#3B1D5C] rounded-xl focus:border-pink focus:outline-none bg-[#200F35] font-sans text-sm text-white"
                            />
                          </div>
                        </div>
                        <div>
                          <label className="block text-graphite uppercase mb-1">Bespoke Requests (Beverage preference, Quiet Chair)</label>
                          <textarea 
                            rows="2" 
                            value={clientInfo.notes} 
                            onChange={e => setClientInfo({ ...clientInfo, notes: e.target.value })} 
                            placeholder="e.g. Quiet chair session preferred, single cube Yamazaki 12." 
                            className="w-full px-4 py-3 border border-[#3B1D5C] rounded-xl focus:border-pink focus:outline-none bg-[#200F35] font-sans text-sm text-white"
                          ></textarea>
                        </div>
                      </div>

                      <div className="border border-pink/40 rounded-xl p-4 bg-[#200F35] text-xs font-mono space-y-2">
                        <div className="flex justify-between">
                          <span className="text-graphite">Service:</span>
                          <span className="font-bold text-white font-sans">{selectedService.name}</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-graphite">Artisan:</span>
                          <span className="font-bold text-pink">{selectedBarber}</span>
                        </div>
                        <div className="flex justify-between">
                          <span className="text-graphite">Date & Time:</span>
                          <span className="font-bold text-white">{selectedDate} at {selectedTime}</span>
                        </div>
                        <div className="flex justify-between pt-2 border-t border-[#3B1D5C] text-sm">
                          <span className="font-bold text-white">Total Investment:</span>
                          <span className="font-bold text-pink font-mono text-base">${totalInvestment}</span>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* Step 5: Success */}
                  {bookingStep === 5 && (
                    <div className="text-center py-12 space-y-6">
                      <div className="w-16 h-16 rounded-full bg-pink/20 text-pink border border-pink flex items-center justify-center mx-auto text-2xl font-bold shadow-lg shadow-pink/30">
                        ✓
                      </div>
                      <div className="space-y-2">
                        <span className="font-mono text-xs uppercase tracking-ultra-wide text-pink font-semibold">Reservation Confirmed</span>
                        <h4 className="font-serif text-3xl font-normal text-white">Your Chair Awaits</h4>
                        <p className="text-graphite text-xs sm:text-sm max-w-sm mx-auto">
                          Reservation <span className="font-mono font-bold text-pink">#AC-8842</span> has been registered. Our concierge will welcome you upon arrival on Madison Ave.
                        </p>
                      </div>

                      <div className="p-4 rounded-xl bg-[#200F35] border border-[#3B1D5C] text-left max-w-xs mx-auto text-xs font-mono space-y-1.5">
                        <div className="flex justify-between"><span className="text-graphite">Chair:</span><span className="text-white">{selectedBarber}</span></div>
                        <div className="flex justify-between"><span className="text-graphite">Schedule:</span><span className="text-white">{selectedDate} at {selectedTime}</span></div>
                        <div className="flex justify-between"><span className="text-graphite">Concierge Valet:</span><span className="text-pink">Madison & 65th St</span></div>
                      </div>

                      <button onClick={closeBooking} className="px-8 py-3 bg-pink text-white rounded-full font-mono text-xs uppercase tracking-widest hover:bg-pink-dark transition-colors font-bold shadow-lg shadow-pink/30">
                        Return to Sanctuary
                      </button>
                    </div>
                  )}

                </div>

                {/* Footer Controls */}
                {bookingStep <= 4 && (
                  <div className="p-6 border-t border-[#3B1D5C] bg-[#120722] flex items-center justify-between">
                    {bookingStep > 1 ? (
                      <button 
                        onClick={() => setBookingStep(bookingStep - 1)} 
                        className="px-4 py-2.5 rounded-xl border border-[#3B1D5C] text-graphite hover:text-white font-mono text-xs uppercase tracking-wider"
                      >
                        Back
                      </button>
                    ) : <div></div>}

                    <div className="flex items-center space-x-4 ml-auto">
                      <div className="text-right">
                        <span className="block text-[10px] font-mono uppercase text-graphite">Estimated Investment</span>
                        <span className="font-mono text-lg font-bold text-pink">${totalInvestment}</span>
                      </div>
                      <button 
                        onClick={() => setBookingStep(bookingStep + 1)} 
                        className="px-6 py-3 rounded-full bg-pink hover:bg-pink-dark text-white font-mono text-xs uppercase tracking-widest font-semibold flex items-center space-x-2 shadow-lg shadow-pink/30 transition-all active:scale-95"
                      >
                        <span>
                          {bookingStep === 1 && 'Choose Date & Time'}
                          {bookingStep === 2 && 'Select Artisan'}
                          {bookingStep === 3 && 'Contact Details'}
                          {bookingStep === 4 && 'Confirm Reservation'}
                        </span>
                        <span>&rarr;</span>
                      </button>
                    </div>
                  </div>
                )}
              </aside>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</body>
</html>
